<!doctype html>
<html lang="fr-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8c1d2e">
<meta name="description" content="Dossier de travaux pratiques en électricité – Institut Saint-Roch, Marche-en-Famenne">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Dossier TP 3Pélec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : barre d'atelier en haut, cartouche de dessin technique, feuilles en onglets.
   Couleurs : neutres gris-bleu, accent bordeaux de l'école, feuilles « papier » claires dans les deux thèmes. */
:root {
  --bg: #eceff2;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #1b2129;
  --muted: #5a6573;
  --line: #d3d9e0;
  --accent: #8c1d2e;
  --accent-ink: #ffffff;
  --accent-soft: #f6e7ea;
  --ok: #1d7a49;
  --ok-soft: #e3f3ea;
  --warn: #9a5800;
  --warn-soft: #fbf0dc;
  --prof: #2f5d8a;
  --prof-soft: #e4edf6;
  --paper: #fdfdfb;
  --paper-ink: #1a1a1a;
  --paper-grid: #e9ecef;
  --paper-grid-2: #dde1e6;
  --board: #d8b285;
  --board-edge: #b18657;
  --wood: #c99760;
  --tube: #a9aeb4;
  --tube-edge: #4f555c;
  --saillie: #f0e8d5;
  --saillie-edge: #9c8f73;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181d; --surface: #1c2229; --surface-2: #222a32; --ink: #e6e9ed; --muted: #9aa5b2; --line: #2f3843;
    --accent: #e0677b; --accent-ink: #1a0b0e; --accent-soft: #3a1d24; --ok: #5cc98d; --ok-soft: #173326;
    --warn: #e6a74c; --warn-soft: #3a2b14; --prof: #8db8e3; --prof-soft: #1c2c3d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181d; --surface: #1c2229; --surface-2: #222a32; --ink: #e6e9ed; --muted: #9aa5b2; --line: #2f3843;
  --accent: #e0677b; --accent-ink: #1a0b0e; --accent-soft: #3a1d24; --ok: #5cc98d; --ok-soft: #173326;
  --warn: #e6a74c; --warn-soft: #3a2b14; --prof: #8db8e3; --prof-soft: #1c2c3d; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: 2.1rem; } h2 { font-size: 1.5rem; } h3 { font-size: 1.2rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row { display: flex; gap: 10px; align-items: center; } .wrapr { flex-wrap: wrap; } .between { justify-content: space-between; }
.as-link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

/* boutons */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 11px; font-size: .88rem; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.ibtn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 30px; height: 30px; display: inline-grid; place-items: center; line-height: 1; }
.ibtn:hover { border-color: var(--accent); color: var(--accent); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: .86rem; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { display: inline-block; font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.pill-prof { background: var(--prof-soft); color: var(--prof); }
.state { font-size: .8rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.state.ok { background: var(--ok-soft); color: var(--ok); } .state.cur { background: var(--warn-soft); color: var(--warn); }
.notice { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); color: var(--ink); padding: 10px 14px; border-radius: 8px; }
.notice.prof { background: var(--prof-soft); border-color: color-mix(in srgb, var(--prof) 30%, transparent); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.inline { display: inline-flex; gap: 6px; align-items: center; } .inline input { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; width: 280px; max-width: 100%; }
.err { color: var(--accent); min-height: 1.4em; font-size: .9rem; }

/* connexion */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(var(--bg), var(--bg)) padding-box, repeating-linear-gradient(0deg, transparent 0 23px, var(--line) 23px 24px), repeating-linear-gradient(90deg, transparent 0 23px, var(--line) 23px 24px); }
.login-card { width: min(460px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: grid; gap: 16px; box-shadow: 0 18px 40px -24px rgba(20, 30, 45, .35); }
.login-card h1 { font-size: 1.8rem; margin-top: 6px; }
.lead { color: var(--muted); }
.btn.google { justify-content: center; padding: 11px; }
.btn.google svg { width: 18px; height: 18px; }
.demo-box { border-top: 1px dashed var(--line); padding-top: 16px; display: grid; gap: 10px; }
.demo-title { font-size: .92rem; color: var(--muted); }
#login-form input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.brand { display: flex; gap: 12px; align-items: center; text-align: left; }
.brand-mark { width: 40px; height: 40px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 22px; height: 22px; fill: var(--accent-ink); }
.brand-name { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .02em; line-height: 1; }
.brand-sub { display: block; font-size: .78rem; color: var(--muted); letter-spacing: .02em; }

/* barre du haut */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.topbar .brand { color: var(--ink); text-decoration: none; }
.topnav { display: flex; gap: 4px; margin-left: 8px; flex-wrap: wrap; }
.topnav button { background: none; border: 0; padding: 7px 12px; border-radius: 7px; font-weight: 500; color: var(--muted); }
.topnav button:hover { color: var(--ink); background: var(--surface-2); }
.topnav .navlink { padding: 7px 12px; border-radius: 7px; font-weight: 500; color: var(--muted); text-decoration: none; }
.topnav .navlink:hover { color: var(--ink); background: var(--surface-2); }
.topnav button.on { color: var(--ink); background: var(--surface-2); box-shadow: inset 0 -2px 0 var(--accent); }
.who { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.who-name { font-weight: 600; }
main.wrap { padding-block: 24px 40px; display: grid; gap: 18px; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .82rem; padding-block: 18px 30px; border-top: 1px solid var(--line); }

/* accueil */
.hello { display: grid; gap: 6px; max-width: 72ch; }
.hello p { color: var(--muted); }
.ex-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 10px; }
.ex-card { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.ex-card:hover { border-color: var(--accent); }
.ex-num { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--accent); min-width: 4.2ch; }
.ex-main { display: grid; min-width: 0; }
.ex-title { font-weight: 600; } .ex-sub { color: var(--muted); font-size: .88rem; font-family: var(--font-mono); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 12px; }
.card.narrow { max-width: 560px; }
.card.next ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.form-grid { display: grid; gap: 12px; }
.form-grid label { display: grid; gap: 4px; font-weight: 500; }
.form-grid input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }

/* cartouche (en-tête commun des feuilles) */
.crumbs { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cartouche { display: grid; grid-template-columns: 1.4fr repeat(4, minmax(0, 1fr)); grid-template-areas: "school n p c d" "school tp tp tp sheet"; border: 2px solid var(--ink); background: var(--surface); border-radius: 4px; }
.cartouche > * { padding: 8px 12px; border-left: 1px solid var(--ink); border-top: 1px solid var(--ink); min-width: 0; }
.c-school { grid-area: school; border-left: 0; border-top: 0; display: grid; align-content: center; gap: 1px; font-size: .82rem; color: var(--muted); }
.c-school b { font-family: var(--font-display); font-size: 1.25rem; color: var(--ink); font-weight: 700; letter-spacing: .02em; }
.cartouche .c-cell:nth-of-type(2), .cartouche .c-cell:nth-of-type(3), .cartouche .c-cell:nth-of-type(4), .cartouche .c-cell:nth-of-type(5) { border-top: 0; }
.c-cell:nth-of-type(2) { grid-area: n; } .c-cell:nth-of-type(3) { grid-area: p; } .c-cell:nth-of-type(4) { grid-area: c; } .c-cell:nth-of-type(5) { grid-area: d; }
.c-tp { grid-area: tp; } .c-sheet { grid-area: sheet; }
.cartouche .k { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.cartouche .v { display: block; font-weight: 600; overflow-wrap: anywhere; }
.c-tp .k { color: var(--accent); font-weight: 700; } .c-tp .v { font-family: var(--font-display); font-size: 1.25rem; }
@media (max-width: 760px) {
  .cartouche { grid-template-columns: 1fr 1fr; grid-template-areas: "school school" "n p" "c d" "tp tp" "sheet sheet"; }
  .cartouche > * { border-left: 0; border-top: 1px solid var(--ink) !important; }
  .c-school { border-top: 0 !important; }
  .c-cell:nth-of-type(3), .c-cell:nth-of-type(5) { border-left: 1px solid var(--ink); }
}

/* onglets */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tabs button { flex: none; background: none; border: 0; padding: 10px 14px; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.sheet { display: grid; gap: 16px; min-width: 0; }
.sheet-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.sheet-head > div { display: grid; gap: 4px; max-width: 75ch; }
.sheet-head p { color: var(--muted); }

/* énoncé */
.enonce { display: grid; gap: 16px; max-width: 980px; }
.situation { font-size: 1.05rem; max-width: 72ch; }
.facts { display: grid; gap: 0; margin: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.facts > div { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
.facts > div:first-child { border-top: 0; }
.facts dt { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-top: 2px; }
.facts dd { margin: 0; min-width: 0; }
@media (max-width: 560px) { .facts > div { grid-template-columns: 1fr; gap: 2px; } }

/* tableaux */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl thead th { background: var(--surface-2); font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; white-space: nowrap; } .tbl .c { text-align: center; }
.tbl td.empty, .empty { color: var(--muted); text-align: center; padding: 22px; }
.tbl tr.locked td { background: var(--surface-2); color: var(--muted); }
.bdc input[type=number] { width: 78px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; text-align: right; background: var(--surface); font-family: var(--font-mono); }
.verif { color: var(--warn); font-weight: 700; margin-left: 2px; }
.lock { margin-left: 8px; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--line); color: var(--ink); }
.totals { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.tva-box { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.tva-box label { font-weight: 600; font-size: .9rem; }
.tva-box select, .tva-box textarea { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); width: 100%; max-width: 100%; }
.sum { margin: 0; border: 2px solid var(--ink); border-radius: 4px; background: var(--surface); }
.sum > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
.sum > div:first-child { border-top: 0; }
.sum dt { font-weight: 500; } .sum dd { margin: 0; font-weight: 600; }
.sum .grand { background: var(--surface-2); border-top: 2px solid var(--ink); }
.sum .grand dt { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; } .sum .grand dd { font-size: 1.15rem; }
.foot-note { font-size: .82rem; color: var(--muted); }
@media (max-width: 760px) { .totals { grid-template-columns: 1fr; } }

/* catalogue */
.cat-filters { display: grid; gap: 8px; }
.cat-filters input[type=search] { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(15, 20, 28, .45); }
.dlg-in { padding: 18px 20px 20px; display: grid; gap: 12px; }
.dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.cat-list { list-style: none; margin: 0; padding: 0; max-height: 52vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
.cat-list li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.cat-list li:first-child { border-top: 0; }
.cat-list li > div { display: grid; min-width: 0; }
.cat-des { font-weight: 500; } .cat-meta { font-size: .8rem; color: var(--muted); }

/* en ligne : synchronisation, connexion, liste des élèves */
.sync { font-size: .78rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.sync-ok { background: var(--ok-soft); color: var(--ok); }
.sync-cours { background: var(--prof-soft); color: var(--prof); }
.sync-hors { background: var(--warn-soft); color: var(--warn); }
.sync-err { background: var(--accent-soft); color: var(--accent); max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.login-steps { margin: 0; padding-left: 1.3em; color: var(--muted); font-size: .92rem; display: grid; gap: 2px; }
.eleves { min-width: 900px; }
.eleves td, .eleves th { padding: 6px 8px; }
.eleves .mail { display: block; font-size: .76rem; }
.cell-btn { border: 1px solid transparent; font: inherit; font-size: .76rem; font-weight: 600; cursor: pointer; }
.cell-btn:hover { border-color: var(--accent); }

/* correction (V2) */
.state.todo { background: var(--warn-soft); color: var(--warn); }
.corr-grid { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
.corr-side, .corr-main { display: grid; gap: 10px; min-width: 0; }
@media (max-width: 860px) { .corr-grid { grid-template-columns: 1fr; } }
.grille { background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; }
.grille .g-in { width: 64px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; text-align: right; background: var(--surface); color: var(--ink); }
.grille .g-tot td { font-weight: 700; background: var(--surface-2); border-top: 2px solid var(--ink); }
.corr-com { font-weight: 600; }
#g-com { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; }
.corr-part, .corr-hist { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.corr-part summary, .corr-hist summary { display: flex; gap: 10px; align-items: center; padding: 10px 14px; cursor: pointer; flex-wrap: wrap; }
.corr-hist summary { font-weight: 600; color: var(--muted); }
.corr-titre { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.corr-badges { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.corr-score { margin-left: auto; font-weight: 600; }
.pill-err, .pill-rem, .pill-ok { font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.pill-err { background: var(--accent-soft); color: var(--accent); } .pill-rem { background: var(--warn-soft); color: var(--warn); } .pill-ok { background: var(--ok-soft); color: var(--ok); }
.constats { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; gap: 6px; }
.constats li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
.c-ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; }
.c-erreur .c-ico { background: var(--accent); color: var(--accent-ink); } .c-remarque .c-ico { background: var(--warn); color: #fff; } .c-ok .c-ico { background: var(--ok-soft); color: var(--ok); }
.c-ok .c-txt { color: var(--muted); }
.c-code { font: 600 .7rem var(--font-mono); padding: 1px 6px; border-radius: 4px; background: var(--prof-soft); color: var(--prof); white-space: nowrap; }
.corr-comment { background: var(--prof-soft); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
.corr-comment .k { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--prof); font-weight: 600; }
.corr-again { border: 1px dashed var(--accent); border-radius: 10px; padding: 12px; display: grid; gap: 8px; justify-items: start; }

/* éditeur du catalogue (prof) */
.cat-edit { min-width: 1040px; }
.cat-edit td { padding: 4px 6px; }

/* mode opératoire */

.steps li { display: flex; justify-content: space-between; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; flex-wrap: wrap; }

.step { display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: start; flex: 1 1 420px; min-width: 0; cursor: pointer; }
.step input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--ok); }
.step-n { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--accent); min-width: 2ch; }
.steps li.done .step-t { color: var(--muted); }
.step-side { display: flex; gap: 10px; align-items: center; margin-left: auto; }

/* outillage */
.tool-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 14px; }
.tool-col { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 12px 14px; margin: 0; display: grid; gap: 2px; min-width: 0; }
.tool-col legend { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; padding: 0 6px; }
.check { display: flex; gap: 10px; align-items: center; padding: 5px 2px; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }

/* remise */
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-width: 640px; }
.parts li { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
.parts li .state { margin-left: auto; }
.parts .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.parts li.ok .dot { background: var(--ok); }
.photo-box { display: grid; gap: 8px; max-width: 640px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; justify-items: start; }
#photo-prev img { border-radius: 8px; border: 1px solid var(--line); max-height: 360px; width: auto; }

/* apprendre */
.fiche-cat { display: grid; gap: 10px; }
.fiche-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 8px; }
.fiche-card { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-height: 58px; font-weight: 500; }
.fiche-card:hover { border-color: var(--accent); }
.fiche-card svg.mini { width: 34px; height: 38px; flex: none; border-radius: 4px; }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
.fiche-body { display: grid; gap: 8px; max-width: 68ch; }
.fiche-body ul, .fiche-body ol { margin: 0; padding-left: 1.25em; display: grid; gap: 5px; }
.fiche-illus { display: flex; gap: 16px; flex-wrap: wrap; }
.fiche-illus figure { margin: 0; display: grid; gap: 4px; justify-items: center; }
.fiche-illus svg { width: 150px; height: 150px; border: 1px solid var(--line); border-radius: 8px; }
.fiche-illus .real-svg { background: #e3e6e9; }
.fiche-illus figcaption { font-size: .78rem; color: var(--muted); }

/* éditeurs */
.editor { display: grid; gap: 10px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.tool-group { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.tbtn { border: 0; background: transparent; padding: 7px 12px; font-size: .9rem; font-weight: 500; border-left: 1px solid var(--line); }
.tbtn:first-child { border-left: 0; }
.tbtn.on { background: var(--ink); color: var(--bg); }
.tbtn:disabled { opacity: .45; cursor: not-allowed; }
.swatches { padding: 4px; gap: 4px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); background: var(--c); }
.swatch[style*="--c2"] { background: repeating-linear-gradient(135deg, var(--c) 0 5px, var(--c2) 5px 10px); }
.swatch.on { box-shadow: 0 0 0 2px var(--ink); }
.palette { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.sym-palette .symbtn { display: grid; justify-items: center; gap: 2px; width: auto; min-width: 92px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--paper-ink); font-size: .74rem; line-height: 1.15; text-align: center; }
.sym-palette .symbtn svg { width: 34px; height: 46px; }
.sym-palette .symbtn.on { box-shadow: 0 0 0 2px var(--accent); }
.svg-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
.svg-wrap svg { display: block; width: 100%; min-width: 640px; height: auto; touch-action: manipulation; }
.paper-wrap { background: var(--paper); }
.hint { font-size: .88rem; color: var(--muted); }
.cab-summary { display: grid; gap: 4px; font-size: .88rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.cab-summary .k { font-weight: 600; margin-right: 8px; }
.cab-summary .warn { color: var(--warn); font-weight: 600; }

/* --- SVG : planche --- */

.saillie-sep { stroke: var(--saillie-edge); stroke-width: .8; stroke-dasharray: 3 2; }

.meca-txt { font: 4px var(--font-mono); fill: #4b5158; }
.din { fill: #c9ced3; stroke: #8a9197; stroke-width: .8; }
.din-hole { fill: #9aa1a7; }
.mod-body { fill: #f4f4f1; stroke: #8d949b; stroke-width: .8; }
.mod-face { fill: #e6e7e3; stroke: #a5abb0; stroke-width: .5; }
.mod-txt { font: 600 5px var(--font-body); fill: #3a4046; }
.mod-lever { fill: #f39200; stroke: #b86e00; stroke-width: .5; }
.mod-lcd { fill: #c7d6bf; stroke: #6f767d; stroke-width: .5; }
.mod-lcd-txt { font: 5px var(--font-mono); fill: #26302a; }
.mod-dial { fill: #fff; stroke: #6f767d; stroke-width: .6; }
.mod-dial-hand { stroke: #3a4046; stroke-width: .9; stroke-linecap: round; }
.mod-brand { font: italic 600 4px var(--font-body); fill: #0060a8; }
.meca-led { fill: #ffd43b; stroke: #c99a00; stroke-width: .5; }
.borne-lbl { font: 700 6.2px var(--font-body); fill: #1b1b1b; paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 1.6px; pointer-events: none; }

.tag-bg { fill: #fff; stroke: #1b1b1b; stroke-width: 1; } .tag-lamp { fill: #fff6d6; } .tag-dev { fill: #e9f0f7; }
.tag-txt { font: 600 11px var(--font-mono); fill: #1b1b1b; }
.axis { stroke: #8c1d2e; stroke-width: 1; stroke-dasharray: 14 4 2 4; }

/* --- SVG : feuilles papier (principe, unifilaire) --- */
.paper-svg { background: var(--paper); }
.grid .g1 { stroke: var(--paper-grid); stroke-width: .5; } .grid .g2 { stroke: var(--paper-grid-2); stroke-width: .6; }
.base-line { stroke: #1a1a1a; stroke-width: 1.6; fill: none; } .base-line.dash { stroke-dasharray: 5 4; stroke-width: 1; }

.svg-wrap .principe-svg { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.principe-svg[data-etat="placer"] { cursor: copy; } .principe-svg[data-etat="fil"] { cursor: crosshair; }
.principe-svg[data-etat="placer"] .pwire-hit, .principe-svg[data-etat="placer"] .pterm-hit { pointer-events: none; }
.base-hit { cursor: pointer; }

.pstart { fill: #8c1d2e; pointer-events: none; }
.pjoint { fill: #1a1a1a; }

.u-line { stroke: #1a1a1a; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.u-line.dash { stroke-dasharray: 6 5; }

.u-txt { font: 13px var(--font-body); fill: #1a1a1a; } .u-txt.b { font-weight: 700; }
.u-small { font: 600 11px var(--font-mono); fill: #1a1a1a; }

/* unifilaire */

.uni-grid .svg-wrap svg { min-width: 420px; }

.uni-form fieldset { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 10px 14px 14px; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; min-width: 0; }
.uni-form legend { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; padding: 0 6px; }
.uni-form label { display: grid; gap: 3px; font-size: .84rem; color: var(--muted); }
.uni-form select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.u-points { grid-template-columns: 1fr !important; }
#u-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
#u-list li { border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 6px; background: var(--surface-2); }
.u-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.u-items { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
.u-tag { font-size: .78rem; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.u-ctl { display: inline-flex; gap: 4px; }
.u-add { display: flex; flex-wrap: wrap; gap: 4px; }
.u-b2 { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: .78rem; color: var(--muted); margin-left: 6px; padding-left: 8px; border-left: 2px solid var(--line); }
.u-cible { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0; }
.u-cible .chip { font-size: .76rem; padding: 2px 8px; }
.u-add .chip { font-size: .76rem; padding: 2px 8px; }
@media (max-width: 860px) { .uni-grid { grid-template-columns: 1fr; } }

/* impression (application installée) */
@media print {
  .topbar, .foot, .tabs, .crumbs, .toolbar, .palette, .hint, .btn, .notice.prof, .u-add, .u-ctl, #u-add { display: none !important; }
  body { background: #fff; }
  main.wrap { padding: 0; }
  .svg-wrap { border: 0; overflow: visible; } .svg-wrap svg { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* classes, schémas à la main, nouvelle année */
.ma-classe { margin: 0; }
.el-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.el-bar select, .dlg-petit select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 100%; }
.el-bar .inline input { width: 220px; }
.cl-cell { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.ibtn.small-i { width: 26px; height: 26px; font-size: .85rem; flex: none; }
.main-box { display: grid; gap: 8px; margin-top: 18px; padding: 16px; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--surface); max-width: 760px; justify-items: start; }

.main-box p { margin: 0; }
.main-file { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.main-ico { width: 60px; height: 76px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; font-weight: 700; font-size: .8rem; color: var(--accent); background: var(--accent-soft); }
.mains-resume { margin: 4px 0 0; } .ok-txt { color: var(--ok); }
.mains-corr { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.mains-corr h3, .mains-corr p { margin: 0; }
.voir-main img { width: 100%; height: auto; max-height: 70vh; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
.voir-main iframe { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.dlg-petit { max-width: 520px; }
.zone-annee { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }

.na-etapes { margin: 0 0 8px; padding-left: 1.2em; display: grid; gap: 6px; }

.btn.danger:disabled { opacity: .45; cursor: not-allowed; }
@media print { .main-box input, .main-box label.btn, .main-box button { display: none !important; } }

/* impression du dossier complet */
.print-all { display: grid; gap: 28px; }
.print-page { display: grid; gap: 14px; }
.print-page + .print-page { border-top: 2px dashed var(--line); padding-top: 24px; }
.print-img { display: block; max-width: 100%; max-height: 24cm; height: auto; margin: 0 auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
@media print {
  .no-print-all { display: none !important; }
  .print-all { gap: 0; }
  .print-page { break-before: page; page-break-before: always; }
  .print-page:first-child { break-before: auto; page-break-before: auto; }
  .print-page + .print-page { border: 0; padding-top: 0; }
  .print-img { border: 0; break-inside: avoid; }
}

/* V3 : créateur d'exercices */
.cr-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .cr-grid { grid-template-columns: 1fr; } .cr-palette { position: static !important; max-height: none !important; display: flex !important; flex-wrap: wrap; } .cr-palette h3 { width: 100%; } }
.cr-palette { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow-y: auto; overscroll-behavior: contain; display: grid; align-content: start; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }

.cr-chip { display: flex; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 8px 4px 4px; cursor: grab; color: var(--ink); }
.cr-chip:hover { border-color: var(--accent); }

.cr-chip svg, .cr-card svg { width: 30px; height: 34px; flex: none; background: #fff; border-radius: 4px; }
.cr-chip span { display: grid; line-height: 1.2; } .cr-chip small { color: var(--muted); font-size: .74rem; }
.cr-main { display: grid; gap: 16px; min-width: 0; }
.cr-board { display: grid; gap: 14px; padding: 16px; border: 2px dashed var(--line); border-radius: var(--radius); background: color-mix(in srgb, #c89a62 14%, var(--surface)); min-height: 180px; transition: border-color .15s; }
.cr-board.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.cr-zone h3 { margin: 0 0 8px; font-size: 1rem; }
.cr-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.cr-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; }

.tri { display: inline-flex; gap: 4px; flex: none; }
.tri-b { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 600; cursor: pointer; }
.tri-b:disabled { cursor: default; }
.tri-b.ok.on { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.tri-b.ko.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.ess-res { margin: 0; font-weight: 600; } .ess-res.ok { color: var(--ok); } .ess-res.ko { color: var(--accent); }
.ess-apres { display: flex; gap: 12px; align-items: center; }
.dep-fiche textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 400; }
.ess-bloc.pf { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
.ess-bloc.pf p { margin: 0; }
#ess-com { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); font: inherit; }
/* V3 : photo annotée */
.annot-wrap { position: relative; display: block; max-width: 100%; line-height: 0; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
.annot-wrap img { width: 100%; height: auto; display: block; }
.annot-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.annot-wrap.edit .annot-svg { cursor: crosshair; touch-action: none; }
.annot-dlg { max-width: 1000px; }
dialog:has(.annot-dlg) { width: min(1000px, calc(100vw - 24px)); }
.annot-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.an-eleve { margin-top: 14px; display: grid; gap: 8px; } .an-eleve:empty { display: none; }
@media print { .tri-b:not(.on) { display: none; } .ess-tbl select, .ess-tbl input { border: 0; appearance: none; } }
